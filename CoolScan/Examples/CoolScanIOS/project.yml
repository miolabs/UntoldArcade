name: CoolScanIOS

packages:
  UntoldEngine:
    url: https://github.com/untoldengine/UntoldEngine.git
    branch: develop
  CoolScan:
    path: ../..

targets:
  CoolScanIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoolScanIOS
    # Keys that are not expressible as INFOPLIST_KEY_* (arrays/dicts) go
    # through a generated Info.plist; Xcode merges it with the generated
    # keys below.
    info:
      path: CoolScanIOS/Info.plist
      properties:
        NSBonjourServices: [_coolscan._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: UntoldEngine
        product: UntoldEngine
      - package: CoolScan
        product: CoolScan
      - package: CoolScan
        product: CoolScanPipeline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miolabs.coolscan
        DEVELOPMENT_TEAM: 53X2422NYU
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "CoolScan uses the camera to scan real objects into 3D models."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "CoolScan looks for a CoolScan server on your Mac to reconstruct scans at full detail."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

schemes:
  CoolScanIOS:
    build:
      targets:
        CoolScanIOS: all
    run:
      config: Debug
      # RealityKit's ObjectCaptureView trips a Metal API Validation assert in
      # its own meshShadowCalculateMip kernel (missing threadgroup binding)
      # the moment the capture bounding box renders. Apple's bug, not ours —
      # keep the validation layer off so debug runs survive the scan flow.
      enableGPUValidationMode: disabled
    archive:
      config: Release
