name: SplatTwin

packages:
  # The engine provides the mechanisms (a mesh entity that carries a splat beside its geometry,
  # the occluder shell, the mesh fade, the gaussianAsset link); the swap policy that drives them
  # is this demo's own code, in Sources/SplatTwin/GaussianTwins.
  UntoldEngine:
    url: https://github.com/untoldengine/UntoldEngine.git
    branch: develop

targets:
  SplatTwin:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - "SplatTwin/GameData"
      - path: Sources/SplatTwin/GameData
        type: folder
        buildPhase: resources
    dependencies:
      - package: UntoldEngine
        product: UntoldEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.untoldengine.splattwin
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

  SplatTwinTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests/SplatTwinTests
    dependencies:
      - target: SplatTwin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.untoldengine.splattwin.tests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES

  # The swap policy on its own, without the app around it: the policy sources are compiled
  # into this bundle and the tests drive the ticks themselves against a renderer they create,
  # so the app's frame loop cannot tick the system underneath them.
  GaussianTwinTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SplatTwin/GaussianTwins
      - path: Tests/GaussianTwinTests
        excludes:
          - "Resources"
      - path: Tests/GaussianTwinTests/Resources
        buildPhase: resources
    dependencies:
      - package: UntoldEngine
        product: UntoldEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.untoldengine.splattwin.gaussiantwintests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SplatTwin:
    build:
      targets:
        SplatTwin: all
        SplatTwinTests: [test]
        GaussianTwinTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SplatTwinTests
        - GaussianTwinTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
