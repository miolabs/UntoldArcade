# The engine's XR frame presented by RealityKit: a RealityView immersive space instead of a
# CompositorLayer (stage 2 of the engine plan docs/proposals/XRRealityKitPresenter.md, tracked
# as untoldengine/UntoldEngine#1371). Regenerate the Xcode project from this folder with
#
#     xcodegen generate
#
# Signing: Config/Config.xcconfig composes the bundle identifier; the gitignored
# Config/Local.xcconfig holds the team (see that file).
name: RealityKitPresenterExample
options:
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  deploymentTarget:
    visionOS: "2.0"
packages:
  # The engine with the UntoldEngineXRRealityKit target, from the fork while the presenter is
  # in review; once it lands upstream, replace with
  #   url: https://github.com/untoldengine/UntoldEngine.git
  #   branch: develop
  # and run `xcodegen generate`. For a local checkout use `path:` to a folder NAMED
  # UntoldEngine (SwiftPM takes the package identity from the folder name).
  UntoldEngine:
    url: https://github.com/miolabs/UntoldEngine.git
    branch: feature/xr_realitykit_presenter
schemes:
  RealityKitPresenterExample:
    build:
      targets:
        RealityKitPresenterExample: all
    run:
      config: Debug
      # Metal's own HUD as a cross-check of the presenter's numbers.
      environmentVariables:
        MTL_HUD_ENABLED: "1"
    profile:
      config: Release
    archive:
      config: Release
targets:
  RealityKitPresenterExample:
    type: application
    platform: visionOS
    sources:
      - path: Sources/RealityKitPresenterExample
        excludes:
          - "Info.plist"
    dependencies:
      - package: UntoldEngine
        product: UntoldEngine
      - package: UntoldEngine
        product: UntoldEngineXR
      - package: UntoldEngine
        product: UntoldEngineXRRealityKit
    info:
      path: Sources/RealityKitPresenterExample/Info.plist
      properties:
        CFBundleDisplayName: RK Presenter
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSWorldSensingUsageDescription: "The engine reads the headset's pose through ARKit to pose each frame."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
        UIRequiredDeviceCapabilities:
          - metal
    configFiles:
      Debug: Config/Config.xcconfig
      Release: Config/Config.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "7"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        UNTOLD_ENGINE_PACKAGE_ROOT: "$(BUILD_DIR)/../../SourcePackages/checkouts/UntoldEngine"
        MTL_HEADER_SEARCH_PATHS: "$(inherited) $(UNTOLD_ENGINE_PACKAGE_ROOT)/Sources/UntoldEngineShaderSupport/include"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
